<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b0f" />
  <meta name="description" content="MVP Gaming — бронирование компьютерных и консольных клубов в Ташкенте" />
  <title>MVP Gaming</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Optional runtime config (Telegram backend). Leave apiBase empty for demo mode. -->
  <script>
    window.MVP_CONFIG = {
      apiBase: '',            // e.g. 'http://localhost:8787' when the bot backend is running
      botUsername: 'MVPGamingBot' // set to your bot's @username
    };
  </script>

  <div id="phone">
    <div class="statusbar">
      <span id="sb-time">9:41</span>
      <span class="sb-right">
        <span>●●●</span>
        <span style="font-size:11px">5G</span>
        <span>▮▮▮</span>
      </span>
    </div>
    <div id="screen"></div>
    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-wrap"></div>

  <!-- Modules (classic scripts, no build step — opens directly via file:// or any static host) -->
  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/art.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/telegram.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
